services:
  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: django_app
    env_file: backend/.env
    ports:
      - "8000:8000" # Port for HTTP(S) Requests
      - "8001:8001" # Port for WebSockets
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - ./backend/staticfiles:/app/staticfiles

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: react_frontend
    ports:
      - "5173:80"
    depends_on:
      - django
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile.celery
    container_name: celery_worker
    env_file: backend/.env
    depends_on:
      - redis
      - django
    volumes:
      - ./backend:/app

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.celery-beat
    container_name: celery_beat
    env_file: backend/.env
    depends_on:
      - redis
      - django
    volumes:
      - ./backend:/app