server {
    listen 80;

    # Serve the built React app (Vite output is in dist)
    root /frontend/dist;
    index index.html;

    # Serve login.html for any unmatched routes (client-side routing with React Router)
    location / {
        try_files $uri /login.html;
    }

    # Proxy API requests to Django backend
    location /api/ {
        proxy_pass http://django:8000;  # Django container name and port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
